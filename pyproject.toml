[project]
name = "mood-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "laya[serve]>=0.3.20",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

# CUDA 12.6 torch from PyTorch's index: the default PyPI build pulls CUDA 13 wheels whose
# nvidia-nvjitlink fails its hash check here.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
